<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <defs>
    <!-- Blue Ribbon Gradient: Electric Sky to Deep Navy -->
    <linearGradient id="blueRibbon" x1="40" y1="30" x2="95" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="35%" stop-color="#0062f5" />
      <stop offset="70%" stop-color="#003dbb" />
      <stop offset="100%" stop-color="#021b58" />
    </linearGradient>

    <!-- Top-Right Ribbon: Luminous Golden Yellow to Vivid Orange -->
    <linearGradient id="orangeRibbon" x1="90" y1="20" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffbe00" />
      <stop offset="45%" stop-color="#ff8400" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <!-- Inner Swirl: Emerald Mint to Radiant Cyan -->
    <linearGradient id="cyanCurve" x1="100" y1="90" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d8a5" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Sunburst Rays Gradient -->
    <linearGradient id="sunRay" x1="130" y1="20" x2="160" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffbe00" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <!-- Soft Drop Shadow for Center Disc -->
    <filter id="discShadow" x="46" y="44" width="92" height="92" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#021b58" flood-opacity="0.22" />
    </filter>

    <!-- Soft Ground Shadow under Pin Tip -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021b58" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#021b58" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left: Pin Icon -->
  <g transform="translate(10, 0)">
    <!-- Ground Shadow -->
    <ellipse cx="92" cy="184" rx="26" ry="5.5" fill="url(#groundShadow)" />

    <!-- 3 Sunburst Rays (Sparks) -->
    <g>
      <!-- Ray 1 (Top) -->
      <rect x="131" y="24" width="8" height="19" rx="4" transform="rotate(32 135 33)" fill="url(#sunRay)" />
      <!-- Ray 2 (Middle) -->
      <rect x="146" y="46" width="8" height="17" rx="4" transform="rotate(68 150 54)" fill="url(#sunRay)" />
      <!-- Ray 3 (Bottom) -->
      <rect x="148" y="73" width="7.5" height="15" rx="3.75" transform="rotate(96 151 80)" fill="url(#sunRay)" />
    </g>

    <!-- Pin Ribbon Fold 1: Orange/Yellow Top-Right Arch -->
    <path
      d="M92 24
         C128 24 152 50 152 84
         C152 110 134 135 92 178
         C112 138 138 114 138 84
         C138 56 118 34 92 34
         C82 34 72 38 64 45
         C72 32 82 24 92 24Z"
      fill="url(#orangeRibbon)"
    />

    <!-- Pin Ribbon Fold 2: Cyan/Teal Inner Swirl -->
    <path
      d="M92 178
         C116 142 140 116 140 84
         C140 80 139 76 138 72
         C134 98 116 126 94 144
         C92 156 92 168 92 178Z"
      fill="url(#cyanCurve)"
    />

    <!-- Pin Ribbon Fold 3: Blue/Navy Left Outer Shell -->
    <path
      d="M92 24
         C58 24 34 50 34 86
         C34 122 66 152 92 178
         C92 178 62 134 62 88
         C62 60 78 36 98 28
         C96 25 94 24 92 24Z"
      fill="url(#blueRibbon)"
    />

    <!-- Outer smooth wrap blending the pin shape -->
    <path
      d="M92 24
         C56 24 34 52 34 88
         C34 124 64 154 92 178
         C120 154 150 124 150 88
         C150 52 128 24 92 24ZM92 132
         C66.8 132 46 111.2 46 86
         C46 60.8 66.8 40 92 40
         C117.2 40 138 60.8 138 86
         C138 111.2 117.2 132 92 132Z"
      fill="url(#blueRibbon)"
      opacity="0.95"
    />

    <!-- Central White Circular Disc -->
    <circle cx="92" cy="86" r="33" fill="#FFFFFF" filter="url(#discShadow)" />

    <!-- Storefront Silhouette inside White Disc (Navy #021b58) -->
    <g fill="#021b58">
      <!-- 3-Scallop Awning / Canopy -->
      <path
        d="M72 75
           C72 71.5 75 68.5 79 68.5
           H105
           C109 68.5 112 71.5 112 75
           L110.5 81.5
           C110.5 84 108.5 86 106 86
           C103.5 86 101.5 84 101.5 81.5
           L101 79
           H99
           L98.5 81.5
           C98.5 84 96.5 86 94 86
           C91.5 86 89.5 84 89.5 81.5
           L89 79
           H87
           L86.5 81.5
           C86.5 84 84.5 86 82 86
           C79.5 86 77.5 84 77.5 81.5
           L76 75
           Z"
      />
      <!-- Lower Storefront Base with Arched Entryway -->
      <path
        d="M75 84.5
           H109
           V102
           C109 104 107.5 105 105.5 105
           H99
           V95
           C99 91.5 85 91.5 85 95
           V105
           H78.5
           C76.5 105 75 104 75 102
           Z"
      />
    </g>
  </g>

  <!-- Right: Clean Typography "OleVeci" (No .com, No slogan) -->
  <g transform="translate(195, 126)">
    <!-- "Ole" in Deep Navy -->
    <text
      x="0"
      y="0"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-size="106"
      font-weight="900"
      fill="#021b58"
      letter-spacing="-3"
    >Ole</text>

    <!-- "Veci" in Vibrant Electric Sky Blue -->
    <text
      x="180"
      y="0"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-size="106"
      font-weight="900"
      fill="#007aff"
      letter-spacing="-3"
    >Veci</text>
  </g>
</svg>
